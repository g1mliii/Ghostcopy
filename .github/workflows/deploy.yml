# CD for the two things that actually deploy: the Cloudflare Pages site and the
# Supabase edge functions.
#
# DATABASE MIGRATIONS ARE DELIBERATELY NOT HERE. supabase/README.md documents
# that the local migration history and production's have *zero* overlap (33
# local files never applied, 89 applied migrations not in the repo), so
# `supabase db push` would double-apply DDL that already exists. Automating it
# would be actively destructive. Migrations stay manual until that history is
# reconciled with the baseline-and-repair process in supabase/README.md.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'both'
        type: choice
        options: [both, website, functions]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which paths changed, so a website-only commit does not redeploy functions.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      # Full history: on push events paths-filter diffs against the previous
      # commit, which a depth-1 checkout does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
            functions:
              - 'supabase/functions/**'

  website:
    name: Deploy website (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.website == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["both","website"]'), github.event.inputs.target))
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        working-directory: website
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Mirrors the `deploy` script in website/package.json. wrangler is not in
      # devDependencies, so the action supplies it.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name ghostcopy --branch main --commit-dirty=true

  functions:
    name: Deploy edge functions (Supabase)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.functions == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["both","functions"]'), github.event.inputs.target))
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must both be set."
            exit 1
          fi

      # Deploys only the three live functions. functions_archive/ is history and
      # must never be pushed. Edge function secrets (FIREBASE_SERVICE_ACCOUNT,
      # R2_*) live in Supabase's own secret store and are not managed here.
      - name: Deploy
        run: |
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            echo "::group::deploy $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
