# CD for everything that deploys: the Cloudflare Pages site, the Supabase edge
# functions, and database migrations.
#
# Nothing here runs on a pull request. The only automatic trigger is a push to
# main, so a PR can never reach production - review happens before the merge,
# and the merge is what deploys.
#
# Every automatic deploy also waits for CI to pass on the same commit. See the
# `ci_green` job.
#
# Migrations became safe to automate on 2026-09-14, when the local and remote
# migration histories were reconciled (89 dashboard-applied migrations were
# recovered into supabase/migrations/, and 4 hand-written ones were marked
# applied). Before that, `db push` would have double-applied existing DDL.
# `supabase migration list --linked` must stay at zero drift for this to hold -
# apply schema changes as migration files from now on, never through the
# dashboard.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options: [all, website, functions, migrations]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing deploys off a commit whose CI is failing.
  #
  # ci.yml and deploy.yml both fire on the same push, so neither can `needs:`
  # the other - GitHub has no cross-workflow dependency. Poll for the CI run on
  # this exact SHA instead, and refuse to continue unless it succeeded.
  ci_green:
    name: Wait for CI
    runs-on: ubuntu-latest
    # Only the automatic path is gated. A manual dispatch is a deliberate human
    # action, usually recovering from a bad state, so it is allowed through.
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Require CI green on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1"
          fields='.workflow_runs[0] // {} | "\(.status // "none") \(.conclusion // "none")"'
          for attempt in $(seq 1 60); do
            info="$(gh api "$query" --jq "$fields")"
            status="${info%% *}"
            conclusion="${info##* }"
            case "$status" in
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed on $GITHUB_SHA."
                  exit 0
                fi
                echo "::error::CI concluded '$conclusion' on $GITHUB_SHA. Refusing to deploy."
                exit 1
                ;;
              none)
                echo "No CI run for $GITHUB_SHA yet (attempt $attempt/60)."
                ;;
              *)
                echo "CI is $status (attempt $attempt/60)."
                ;;
            esac
            sleep 20
          done
          echo "::error::Timed out after 20 minutes waiting for CI on $GITHUB_SHA."
          exit 1

  # Which paths changed, so a website-only commit does not redeploy functions
  # or touch the database.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      functions: ${{ steps.filter.outputs.functions }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      # Full history: on push events paths-filter diffs against the previous
      # commit, which a depth-1 checkout does not have.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
            functions:
              - 'supabase/functions/**'
            migrations:
              - 'supabase/migrations/**'

  website:
    name: Deploy website (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [ci_green, changes]
    if: >-
      always() && !cancelled() &&
      (needs.ci_green.result == 'success' || needs.ci_green.result == 'skipped') &&
      ((github.event_name == 'push' && needs.changes.outputs.website == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["all","website"]'), github.event.inputs.target)))
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build
        working-directory: website
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Mirrors the `deploy` script in website/package.json. wrangler is not in
      # devDependencies, so the action supplies it.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name ghostcopy --branch main --commit-dirty=true

  functions:
    name: Deploy edge functions (Supabase)
    runs-on: ubuntu-latest
    needs: [ci_green, changes, migrations]
    if: >-
      always() && !cancelled() &&
      (needs.ci_green.result == 'success' || needs.ci_green.result == 'skipped') &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') && (
      (github.event_name == 'push' && needs.changes.outputs.functions == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["all","functions"]'), github.event.inputs.target)))
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must both be set."
            exit 1
          fi

      # Deploys only the three live functions. functions_archive/ is history and
      # must never be pushed. Edge function secrets (FIREBASE_SERVICE_ACCOUNT,
      # R2_*) live in Supabase's own secret store and are not managed here.
      - name: Deploy
        run: |
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            echo "::group::deploy $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

  migrations:
    name: Apply migrations (Supabase)
    runs-on: ubuntu-latest
    needs: [ci_green, changes]
    if: >-
      always() && !cancelled() &&
      (needs.ci_green.result == 'success' || needs.ci_green.result == 'skipped') &&
      ((github.event_name == 'push' && needs.changes.outputs.migrations == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["all","migrations"]'), github.event.inputs.target)))
    # DDL is the one thing here that a re-run cannot undo. `ci_green` above
    # stops a red commit from getting this far, but that is a correctness gate,
    # not a human one. For an approval step as well, add required reviewers to
    # the `production` environment in the repo settings - it has none today.
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must both be set."
            exit 1
          fi

      # No --password. The CLI mints a temporary login role from the access
      # token ("Initialising login role..."), so no database password is
      # needed. Verified from a cold start: with supabase/.temp deleted,
      # `link` then `db push --dry-run` both succeed non-interactively on
      # 2.117.0. That behaviour is why the CLI version above is pinned rather
      # than `latest` - if it ever regressed, this job would need a
      # SUPABASE_DB_PASSWORD secret.
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      # Drift check first. If the histories ever disagree again, `db push` would
      # try to re-apply DDL the database already has - fail before that, not
      # after.
      - name: Check for history drift
        run: |
          supabase migration list --linked --output-format json > list.json
          python3 - <<'PY'
          import json, sys
          m = json.load(open('list.json'))['migrations']
          remote_only = [x['remote'] for x in m if not x['local']]
          if remote_only:
              print(f"::error::{len(remote_only)} migration(s) applied to production have no file in "
                    f"supabase/migrations/: {remote_only[:5]}. Someone applied DDL outside the repo. "
                    "Recover them before pushing - see supabase/README.md.")
              sys.exit(1)
          pending = [x['local'] for x in m if not x['remote']]
          print(f"No drift. {len(pending)} migration(s) pending: {pending or 'none'}")
          PY

      - name: Dry run
        run: supabase db push --dry-run --linked

      - name: Apply
        run: supabase db push --linked
