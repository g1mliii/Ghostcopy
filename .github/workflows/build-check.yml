# Opt-in native compile checks. NOT part of the PR gate.
#
# Why this exists even though nothing is packaged or distributed yet:
# `flutter analyze` only reads Dart. It cannot see a Gradle/AGP mismatch, a
# plugin that needs a newer compileSdk, a CocoaPods resolution failure, or a
# broken MSVC link - all of which have bitten this repo before (see the
# compileSdk 37 note in android/app/build.gradle.kts). This workflow catches
# those, on demand rather than on every push.
#
# Runs weekly so breakage from the ecosystem moving is found early, and on
# demand from the Actions tab. Every job is continue-on-error: none of these
# should ever be a required status check in its current state.
name: Build check (opt-in)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform to compile'
        required: true
        default: 'all'
        type: choice
        options: [all, windows, android, macos, ios]
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  windows:
    name: Windows
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["all","windows"]'), github.event.inputs.platform)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

  android:
    name: Android
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["all","android"]'), github.event.inputs.platform)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # compileOptions in android/app/build.gradle.kts pin Java 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/app/google-services.json is gitignored, but the
      # com.google.gms.google-services plugin refuses to run without it, so a
      # fresh clone cannot compile. The placeholder is structurally valid, which
      # is all the Gradle plugin needs. The resulting APK could NOT receive push
      # notifications - it is never uploaded anywhere, this job only proves the
      # code compiles.
      - name: Stub Firebase config
        run: cp .github/ci/google-services.placeholder.json android/app/google-services.json

      - run: flutter pub get
      - run: flutter build apk --release

  macos:
    name: macOS (never verified by hand)
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["all","macos"]'), github.event.inputs.platform)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # super_native_extensions builds Rust through Cargokit, and a release
      # profile that strips proc-macro dylibs fails to load them on newer macOS
      # toolchains - Cargokit exits 101 before any Swift is compiled. The same
      # two variables are exported by installer/macos/build-release.sh, which
      # is why the release path works and a bare `flutter build macos` does not.
      - run: flutter build macos --release
        env:
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: 'true'
          CARGO_PROFILE_RELEASE_STRIP: none

  ios:
    name: iOS (never verified by hand)
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["all","ios"]'), github.event.inputs.platform)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Repository Actions secret containing the complete, unencoded plist XML.
      # Keep the file out of Git; Xcode now includes it in Runner's resources.
      - name: Configure iOS Firebase
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$IOS_GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Add the IOS_GOOGLE_SERVICE_INFO_PLIST repository Actions secret containing the full GoogleService-Info.plist XML."
            exit 1
          fi
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      # --no-codesign: compile without an Apple signing identity.
      - run: flutter build ios --release --no-codesign
