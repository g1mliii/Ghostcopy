# README badges: Mac downloads and the current macOS version.
#
# GitHub's own "total downloads" counts every asset, and appcast.xml is one -
# every installed Mac fetches it on each update check - so that number would
# climb with checks, not installs. This counts only .dmg files, across every
# release, and writes shields.io endpoint JSON to the orphan `badges` branch,
# which the README reads through raw.githubusercontent.com.
#
# The website's download button serves GhostCopy.dmg from the macos-updates
# release. publish-update.sh renames the outgoing copy rather than replacing
# it, so its downloads stay in this count.
name: Badges

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Count and write
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          downloads=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[].assets[] | select(.name | endswith(".dmg")) | .download_count' \
            | awk '{ s += $1 } END { print s + 0 }')
          # Newest macos-v<version>-<build> tag; the badge shows the version.
          tag=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | select(.tag_name | startswith("macos-v")) | .tag_name' \
            | sort -V | tail -1)
          version=${tag#macos-v}
          version=${version%-*}
          echo "downloads=$downloads version=$version"

          mkdir out && cd out
          printf '{"schemaVersion":1,"label":"Mac downloads","message":"%s","color":"6670FF"}\n' \
            "$(printf "%'d" "$downloads" 2>/dev/null || echo "$downloads")" > downloads.json
          printf '{"schemaVersion":1,"label":"macOS","message":"%s","color":"6670FF"}\n' \
            "${version:-unreleased}" > macos-version.json

          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads.json macos-version.json
          git commit -q -m "badges: $downloads Mac downloads, macOS $version"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
