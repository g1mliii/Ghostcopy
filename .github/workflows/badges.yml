# README badge: the current macOS version.
#
# Shields' own release badge would show the raw tag, macos-v1.0.1-13. This
# writes shields.io endpoint JSON with just the version to the orphan
# `badges` branch, which the README reads through raw.githubusercontent.com.
name: Badges

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Count and write
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Newest macos-v<version>-<build> tag; the badge shows the version.
          tag=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | select(.tag_name | startswith("macos-v")) | .tag_name' \
            | sort -V | tail -1)
          version=${tag#macos-v}
          version=${version%-*}
          echo "version=$version"

          mkdir out && cd out
          printf '{"schemaVersion":1,"label":"macOS","message":"%s","color":"6670FF"}\n' \
            "${version:-unreleased}" > macos-version.json

          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add macos-version.json
          git commit -q -m "badges: macOS $version"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
