# The quality gate. Fast, and expected to be green on every PR.
#
# Deliberately Dart-only: no platform builds. The app is not packaged or
# distributed yet, and store distribution (Play Console / App Store Connect) is
# a separate pipeline anyway. Compile checks for the native targets live in
# build-check.yml, which is opt-in.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to the version the app is developed against, so CI cannot start
  # failing because Flutter shipped a new stable. Bump deliberately.
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # pubspec.lock is committed, so this installs the same versions every
      # machine gets. It used to be ignored and resolved fresh each run, which
      # meant CI and a developer's laptop could compile different code - and on
      # 2026-09-15 they did: CI picked material_ui 1.3.0, which needs a newer
      # SDK than the Flutter pinned above, and every native build broke.
      #
      # The tradeoff is that drift no longer announces itself here. Surface it
      # deliberately instead (`flutter pub upgrade` on a branch) rather than by
      # letting a build break.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      # No --reporter: flutter test defaults to its `github` reporter on
      # Actions, which annotates failures on the diff.
      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
