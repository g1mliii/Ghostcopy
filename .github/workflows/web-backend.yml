# The two non-Flutter parts of the repo: the marketing/support site and the
# Supabase edge functions.
name: Web & backend

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'supabase/functions/**'
      - '.github/workflows/web-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'supabase/functions/**'
      - '.github/workflows/web-backend.yml'
  workflow_dispatch:

concurrency:
  group: web-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install`, not `npm ci`: website/package-lock.json is gitignored, so
      # there is no lockfile to install from. Committing one would make these
      # builds reproducible and let this become `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # build.mjs copies only an explicit allowlist into dist/. If a new page is
      # added to website/ but not published, this is where it shows up.
      - name: Show what was published
        run: ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 14

  edge-functions:
    name: Check edge functions (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Advisory only. The three deployed functions currently have ~13 strict
      # type errors between them (mostly implicit `any` on Supabase/Firebase
      # callback params). `supabase functions deploy` does not type-check, so
      # these are not deploy blockers and the functions work in production.
      # Fix them and then delete continue-on-error to make this a real gate.
      - name: Type-check
        continue-on-error: true
        run: |
          status=0
          for f in supabase/functions/*/index.ts; do
            echo "::group::deno check $f"
            deno check "$f" || status=1
            echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            echo "::warning::Edge functions have type errors - advisory only, see the groups above."
          fi

      - name: Lint
        continue-on-error: true
        run: deno lint supabase/functions/
