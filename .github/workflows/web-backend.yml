# The two non-Flutter parts of the repo: the marketing/support site and the
# Supabase edge functions.
name: Web & backend

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'supabase/functions/**'
      - 'test/backend/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'supabase/functions/**'
      - 'test/backend/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web-backend.yml'
  workflow_dispatch:

concurrency:
  group: web-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # `npm install`, not `npm ci`: website/package-lock.json is gitignored, so
      # there is no lockfile to install from. Committing one would make these
      # builds reproducible and let this become `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # build.mjs copies only an explicit allowlist into dist/. If a new page is
      # added to website/ but not published, this is where it shows up.
      - name: Show what was published
        run: ls -R dist

      - uses: actions/upload-artifact@v5
        with:
          name: website-dist
          path: website/dist
          retention-days: 14

  edge-functions:
    name: Check edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install backend test dependencies
        run: npm ci --prefix test/backend

      - name: Test backend handlers and migrations
        run: npm test --prefix test/backend

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Every function must type-check in CI, including service-role
      # paths that ordinary Flutter tests cannot compile.
      - name: Type-check
        run: |
          status=0
          for f in supabase/functions/*/index.ts; do
            echo "::group::deno check $f"
            deno check "$f" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Test native push payloads and WNS channels
        run: deno test supabase/functions/send-clipboard-notification/messages_test.ts supabase/functions/send-clipboard-notification/wns_test.ts

      - name: Lint
        # Versioned jsr/npm prefixes are intentional for independently deployed
        # Supabase functions. Keep the other lint rules enabled.
        run: deno lint --rules-exclude=no-import-prefix supabase/functions/
