name: ghostcopy
description: "Universal clipboard synchronization tool for seamless text sharing across devices."
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# The build number is one counter shared by every platform, so TestFlight and
# Play never see a duplicate. macOS and iOS pass it on the command line
# (`--build-number=N`), which is why this line sat at 5 while they shipped 6,
# 7, 8 and 9. Windows has no such override - it reads this, and every Windows
# build so far therefore reported itself to Sentry as 1.0.0+5 no matter what
# was in it. Bumped to match the other platforms; raise it for each build that
# leaves this machine.
version: 1.0.0+9

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  app_links: ^7.2.1
  cached_network_image: ^4.0.0
  # Injectable clock so time-dependent logic (the lifecycle controller's
  # idle switching) can be driven deterministically in tests. Behaves
  # exactly like DateTime.now() outside a withClock zone.
  clock: ^1.1.2
  crypto: ^3.0.3
  cryptography: ^2.7.0

  # Gives each device a readable name of its own. Without it every phone
  # registers as "<Platform> Device", and `devices` is uniquely indexed on
  # (user_id, device_type, device_name) - so a second device of the same
  # platform overwrites the first's row and takes its FCM token with it.
  device_info_plus: ^11.5.0
  encrypt: ^5.0.3
  file_picker: ^11.0.3
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  google_sign_in: ^6.2.2
  hotkey_manager: ^0.2.0
  http: ^1.2.0
  # Scales down a picked photo only when it is too big to send.
  image: ^4.0.17
  launch_at_startup: ^0.5.1
  mobile_scanner: ^7.1.4
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.1
  qr_flutter: ^4.1.0
  receive_sharing_intent: ^1.8.0
  # Already in the tree via window_manager; declared directly so
  # growToHeight can read the display work area to clamp the window.
  screen_retriever: ^0.2.0
  sentry_flutter: ^9.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.8.0
  super_clipboard: ^0.9.0
  super_drag_and_drop: ^0.9.0

  timeago: ^3.7.0
  tray_manager: ^0.5.3
  url_launcher: ^6.3.0
  window_manager: ^0.5.1

dev_dependencies:
  # Deterministic timer control for the lifecycle controller's idle switching.
  dart_jsonwebtoken: ^3.1.1
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  glados: ^1.1.7  # Pinned version (was: any)
  mocktail: ^1.0.0
  msix: ^3.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts for GhostCopy
  # NOTE: Download font files from Google Fonts and place in assets/fonts/
  # See assets/fonts/README.md for instructions
  # 
  # Uncomment when font files are added:
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/inter/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/inter/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/inter/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/inter/Inter-Bold.ttf
  #         weight: 700
  #   - family: JetBrains Mono
  #     fonts:
  #       - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
  #         weight: 700
  #
  # Alternative: Use google_fonts package (recommended for easier setup)
  # Add to dependencies: google_fonts: ^6.1.0

# MSIX Configuration for Windows Store packaging.
#
# Build with:  flutter build windows --release && dart run msix:create --store
#
# Everything GhostCopy registers for itself at first run is declared here
# instead, because MSIX virtualizes the HKCU writes that would otherwise do it:
# inside a package those writes succeed, land in a private per-package hive,
# and are invisible to the rest of Windows. lib/main.dart skips them when
# IWindowsPackageService reports a packaged process.
#
# Verified by sideloading on 2026-09-25: the COM verb handler instantiates
# from the manifest registration, ActivateApplication carries --send-file
# through with a spaced path, and ghostcopy:// resolves to the package.
msix_config:
  display_name: GhostCopy
  #
  # Assigned by the Store, not chosen: Partner Center > Product identity, for
  # Store ID 9NW0TTGMSF80. The upload is rejected if any of the three differs
  # from the reservation, so they are copied verbatim and not tidied.
  #   identity_name          <- "Package/Identity/Name"
  #   publisher              <- "Package/Identity/Publisher"
  #   publisher_display_name <- "Package/Properties/PublisherDisplayName"
  #
  # These make the package family g1mli.GhostCopy_41asz506sbn22. The Explorer
  # verb handler needs that family name to build the AUMID it activates the
  # app with, but reads it at runtime through GetCurrentPackageFamilyName
  # rather than hard-coding it - see ActivatePackagedApp in
  # windows/explorer_command/send_command.cpp.
  identity_name: g1mli.GhostCopy
  publisher: CN=9BC07F96-83C5-41E5-8344-A470FAD38634
  publisher_display_name: g1mli
  #
  # Independent of pubspec's `version:` above, and must be strictly greater
  # than the last submission.
  #
  # Major.Minor.Build.Revision, and the Store REJECTS any package whose
  # revision - the fourth part - is not zero. So the shared build number goes
  # in the third part, not the fourth: build 9 is 1.0.9.0, not 1.0.0.9. The
  # upload that taught this said "Apps are not allowed to have a Version with
  # a revision number other than zero".
  #
  # A version can never be reused, even by a submission that failed
  # certification, so raise this before rebuilding after a rejection.
  msix_version: 1.0.9.0
  logo_path: assets\icons\app_icon.png
  capabilities: internetClient
  # The Store signs the package; a signature applied here would be replaced.
  store: true
  install_certificate: false

  # Replaces the HKCU\Software\Classes\ghostcopy key that
  # _registerWindowsUrlScheme writes unpackaged. Without it the OAuth callback
  # never comes back from the browser and sign-in hangs with nothing to show.
  protocol_activation: ghostcopy

  # Lets a tapped notification reach the app.
  #
  # Toasts themselves are fine without this - flutter_local_notifications
  # checks GetCurrentPackageFullName and uses the package identity when it
  # finds one. Activation is the part that breaks: the plugin registers its
  # callback with CoRegisterClassObject, which only tells COM about a class
  # while the process is already running, and Windows learns which CLSID
  # activates this app from the HKCU\Software\Classes\AppUserModelId key the
  # plugin writes - virtualized, and so invisible, inside a package. Declared
  # here instead. Receiving a clip and tapping it to copy is most of what the
  # Windows app does, so this is not cosmetic.
  #
  # The clsid must match the `guid` passed to WindowsInitializationSettings in
  # lib/services/impl/notification_service.dart.
  toast_activator:
    clsid: 2c295777-6228-48b4-82a9-7b7c25c78d06
    display_name: GhostCopy Notification Activator

  # Replaces launch_at_startup's Run key. `enabled: false` is deliberate: the
  # app ships with launch-at-startup off and the settings toggle turns it on
  # through RequestEnableAsync. task_id must match kStartupTaskId in
  # windows/runner/flutter_window.cpp, and parameters must match the flag
  # main.dart checks to start hidden.
  startup_task:
    task_id: GhostCopyStartup
    enabled: false
    parameters: --launched-at-startup

  # Replaces the HKCU\Software\Classes\*\shell verb. A packaged verb can only
  # point at a COM class, which is what windows/explorer_command builds; clsid
  # must match CLSID_GhostCopySendCommand in send_command.cpp. dll_path is a
  # build output, so `flutter build windows --release` has to run first.
  #
  # This is the CMake target's own output directory, NOT the runner's Release
  # bundle. msix copies the dll into the bundle to package it and deletes it
  # again afterwards, so a dll_path inside that bundle is a file msix removes
  # and then cannot find on the next run.
  context_menu:
    dll_path: build\windows\x64\explorer_command\Release\ghostcopy_shell.dll
    items:
      - type: '*'
        commands:
          # No braces: the appx schema's ST_GUID is a bare
          # 8-4-4-4-12 pattern, and MakeAppx rejects the manifest with
          # "attribute 'Clsid' ... failed to parse" if they are present.
          - id: GhostCopySend
            clsid: BCE5C0BC-582B-49BA-8FED-537B9F3100C0
