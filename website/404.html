<!DOCTYPE html>
<html lang="en" class="bg-bg">

<head>

<body class="min-h-screen flex flex-col">

    <header class="shell flex items-center h-20 sm:h-24">

        </a>
    </header>

    <main class="shell grow flex items-center py-20 sm:py-28">

            <h1 class="font-bold leading-[1.02] tracking-display text-[40px] sm:text-6xl lg:text-7xl">

            <p class="mt-8 text-base sm:text-lg lg:text-[19px] leading-[1.7] text-ink-2 max-w-prose">

                the old site &mdash; the documentation and support pages were folded into the FAQ.
            </p>

            <nav class="mt-12 flex flex-col sm:flex-row gap-6 sm:gap-10">
                <a href="/" class="cta">Home <span aria-hidden="true">&rarr;</span></a>
                <a href="/faq" class="cta">FAQ <span aria-hidden="true">&rarr;</span></a>
                <a href="/download" class="cta">Download <span aria-hidden="true">&rarr;</span></a>

        </div>
    </main>

    <footer class="shell pb-12">
        <div class="rule mb-8"></div>
        <div class="flex items-center gap-3">
            <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
